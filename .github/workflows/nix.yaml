name: "Build and Cache"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: push-and-pray-config
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check flake
        run: nix flake check --accept-flake-config

      - name: Build Host
        run: |
          nix build \
            .#nixosConfigurations.zeus.config.system.build.toplevel \
            .#nixosConfigurations.ares.config.system.build.toplevel \
            .#nixosConfigurations.hermes.config.system.build.toplevel \
            .#nixosConfigurations.pan.config.system.build.toplevel \
            .#nixosConfigurations.atlas.config.system.build.toplevel \
            --no-link \
            --accept-flake-config
